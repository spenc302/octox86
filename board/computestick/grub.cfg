# ============================================================
#  GRUB Configuration — OctoPi x86
#  32-bit EFI boot for Intel Compute Stick STCK1A32WFC
# ============================================================

set default=0
set timeout=3

# Load video support
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "OctoPi x86" {
    search --no-floppy --label --set=root "octopi-boot"
    linux  /vmlinuz root=LABEL=octopi-root rw quiet loglevel=3 \
           console=tty1 \
           intel_idle.max_cstate=1 \
           pcie_aspm=off \
           systemd.unified_cgroup_hierarchy=1
}

menuentry "OctoPi x86 (recovery / verbose)" {
    search --no-floppy --label --set=root "octopi-boot"
    linux  /vmlinuz root=LABEL=octopi-root rw \
           console=tty1 \
           intel_idle.max_cstate=1
}
