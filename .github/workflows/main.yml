name: Build OctoPi x86 Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc g++ make patch wget curl git \
          cpio unzip rsync bc libncurses-dev libssl-dev \
          python3 python3-pip bison flex file \
          mtools dosfstools e2fsprogs parted \
          grub-efi-ia32-bin

    - name: Cache Buildroot downloads
      uses: actions/cache@v4
      with:
        path: buildroot-downloads
        key: buildroot-downloads-2024.11.1
        restore-keys: |
          buildroot-downloads-

    - name: Cache Buildroot host tools
      uses: actions/cache@v4
      id: cache-host-tools
      with:
        path: octopi-x86-output/host
        key: buildroot-host-2024.11.1-v2-${{ hashFiles('configs/computestick_defconfig') }}
        restore-keys: |
          buildroot-host-2024.11.1-v2-

    - name: Download Buildroot 2024.11.1
      run: |
        wget -q --show-progress \
          https://buildroot.org/downloads/buildroot-2024.11.1.tar.gz \
          -O buildroot.tar.gz
        tar -xf buildroot.tar.gz
        rm buildroot.tar.gz
        echo "Buildroot extracted"

    - name: Configure and Migrate Buildroot Config
      run: |
        mkdir -p octopi-x86-output
        make -C buildroot-2024.11.1 \
          BR2_EXTERNAL=${{ github.workspace }} \
          O=${{ github.workspace }}/octopi-x86-output \
          BR2_DEFCONFIG=${{ github.workspace }}/configs/computestick_defconfig \
          defconfig
        make -C buildroot-2024.11.1 \
          BR2_EXTERNAL=${{ github.workspace }} \
          O=${{ github.workspace }}/octopi-x86-output \
          olddefconfig
        sed -i '/BR2_LEGACY/d' ${{ github.workspace }}/octopi-x86-output/.config
        echo "BR2_DL_DIR=\"${{ github.workspace }}/buildroot-downloads\"" \
          >> octopi-x86-output/.config

    - name: Inject WiFi credentials
      run: |
        mkdir -p ${{ github.workspace }}/overlay/etc/wpa_supplicant
        cat > ${{ github.workspace }}/overlay/etc/wpa_supplicant/wpa_supplicant-wlan0.conf << EOF
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=CA

network={
    ssid="${{ secrets.WIFI_SSID }}"
    psk="${{ secrets.WIFI_PASSWORD }}"
    key_mgmt=WPA-PSK
}
EOF

    - name: Fix script permissions
      run: |
        chmod +x ${{ github.workspace }}/board/computestick/post-build.sh
        chmod +x ${{ github.workspace }}/board/computestick/post-image.sh
        chmod +x ${{ github.workspace }}/overlay/usr/sbin/octopi-firstboot.sh

    - name: Enable loop devices
      run: |
        sudo modprobe loop
        sudo losetup -a

    - name: Build image
      run: |
        export PATH=$(echo $PATH | tr ':' '\n' | grep -v '/mnt/c' | tr '\n' ':' | sed 's/:$//')
        make -C buildroot-2024.11.1 \
          BR2_EXTERNAL=${{ github.workspace }} \
          O=${{ github.workspace }}/octopi-x86-output \
          -j$(nproc)

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: octopi-x86-image
        path: octopi-x86-output/images/octopi-x86.img
        retention-days: 30

    - name: Build summary
      run: |
        echo "### OctoPi x86 Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f octopi-x86-output/images/octopi-x86.img ]; then
          SIZE=$(du -sh octopi-x86-output/images/octopi-x86.img | cut -f1)
          echo "**Image size:** ${SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the image from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "Flash with Rufus in DD Image mode." >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Error:** Output image was not found." >> $GITHUB_STEP_SUMMARY
        fi
