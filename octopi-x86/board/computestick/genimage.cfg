# ============================================================
#  genimage.cfg — Disk Image Layout
#  Produces a flashable .img for the Intel Compute Stick
#
#  Layout:
#    Partition 1: EFI System Partition (FAT32, 64MB)
#                 Contains bootia32.efi + grub.cfg
#                 Also contains octopi-wpa-supplicant.txt
#                 (user edits this on Windows to set WiFi)
#    Partition 2: Root filesystem (ext4, 3GB)
# ============================================================

image boot.vfat {
    vfat {
        label = "octopi-boot"
        files = {
            "EFI/BOOT/bootia32.efi",
            "grub/grub.cfg",
            "vmlinuz",
            "initrd.img",
            "octopi-wpa-supplicant.txt"
        }
    }
    size = 64M
}

image octopi-x86.img {
    hdimage {
        gpt = true
    }

    partition esp {
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
        image = "boot.vfat"
        size = 64M
        bootable = true
    }

    partition rootfs {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "rootfs.ext4"
    }
}
