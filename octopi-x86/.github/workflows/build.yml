name: Build OctoPi x86 Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04  # Uses GCC 11 — avoids all GCC 14 issues
    timeout-minutes: 360   # 6 hour limit

    steps:
    # --------------------------------------------------------
    # 1. Check out your octopi-x86 repo
    # --------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: octopi-x86

    # --------------------------------------------------------
    # 2. Install build dependencies
    # --------------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc g++ make patch wget curl git \
          cpio unzip rsync bc libncurses-dev libssl-dev \
          python3 python3-pip bison flex file \
          genimage mtools dosfstools e2fsprogs parted \
          grub-efi-ia32-bin

    # --------------------------------------------------------
    # 3. Cache Buildroot downloads (speeds up repeat builds)
    # --------------------------------------------------------
    - name: Cache Buildroot downloads
      uses: actions/cache@v4
      with:
        path: buildroot-downloads
        key: buildroot-downloads-2024.11.1
        restore-keys: |
          buildroot-downloads-

    # --------------------------------------------------------
    # 4. Cache built host tools (saves ~1 hour on rebuilds)
    # --------------------------------------------------------
    - name: Cache Buildroot host tools
      uses: actions/cache@v4
      id: cache-host-tools
      with:
        path: octopi-x86-output/host
        key: buildroot-host-2024.11.1-${{ hashFiles('octopi-x86/computestick_defconfig') }}
        restore-keys: |
          buildroot-host-2024.11.1-

    # --------------------------------------------------------
    # 5. Download Buildroot
    # --------------------------------------------------------
    - name: Download Buildroot 2024.11.1
      run: |
        if [ ! -d "buildroot-2024.11.1" ]; then
          wget -q --show-progress \
            https://buildroot.org/downloads/buildroot-2024.11.1.tar.gz \
            -O buildroot.tar.gz
          tar -xf buildroot.tar.gz
          rm buildroot.tar.gz
          echo "Buildroot extracted"
        else
          echo "Buildroot already present"
        fi

    # --------------------------------------------------------
    # 6. Configure
    # --------------------------------------------------------
    - name: Configure Buildroot
      run: |
        mkdir -p octopi-x86-output
        make -C buildroot-2024.11.1 \
          BR2_EXTERNAL=${{ github.workspace }}/octopi-x86 \
          O=${{ github.workspace }}/octopi-x86-output \
          BR2_DEFCONFIG=${{ github.workspace }}/octopi-x86/computestick_defconfig \
          defconfig

        # Point downloads cache to our cached directory
        echo "BR2_DL_DIR=\"${{ github.workspace }}/buildroot-downloads\"" \
          >> octopi-x86-output/.config

    # --------------------------------------------------------
    # 7. Build
    # --------------------------------------------------------
    - name: Build image
      run: |
        make -C buildroot-2024.11.1 \
          BR2_EXTERNAL=${{ github.workspace }}/octopi-x86 \
          O=${{ github.workspace }}/octopi-x86-output \
          -j$(nproc)

    # --------------------------------------------------------
    # 8. Upload finished image as downloadable artifact
    # --------------------------------------------------------
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: octopi-x86-image
        path: octopi-x86-output/images/octopi-x86.img
        retention-days: 30

    # --------------------------------------------------------
    # 9. Print build summary
    # --------------------------------------------------------
    - name: Build summary
      run: |
        echo "### OctoPi x86 Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        SIZE=$(du -sh octopi-x86-output/images/octopi-x86.img | cut -f1)
        echo "**Image size:** ${SIZE}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the image from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
        echo "Flash with Rufus in DD Image mode." >> $GITHUB_STEP_SUMMARY
