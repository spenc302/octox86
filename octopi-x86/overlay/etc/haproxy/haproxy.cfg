global
    maxconn     4096
    log         /dev/log local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    user        haproxy
    group       haproxy
    daemon

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    option      forwardfor
    option      http-server-close
    retries     3
    maxconn     2000
    timeout     connect  5s
    timeout     client   15min
    timeout     server   15min

frontend public
    bind        *:80
    default_backend octoprint

backend octoprint
    option      forwardfor
    server      octoprint1 127.0.0.1:5000
